
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Temperature</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <main>
    <header>
      <h1>Home Temperature</h1>
      <p>Live readings from ESP32-C3 temperature sensor</p>
    </header>

    <section class="card">
      <div class="label">CURRENT TEMPERATURE</div>
      <div class="temperature" id="temperature">--.-°C</div>
      <div class="status" id="updated">Waiting for sensor data...</div>
    </section>

    <section class="card">
      <div class="chart-heading">
        <h2>Last 24 hours</h2>
        <button id="resetButton" type="button">
          ↻ Refresh
        </button>
      </div>

      <div class="label chart-label">Temperature (°C)</div>

      <div class="chart-wrap">
        <canvas id="temperatureChart"></canvas>
      </div>

      <div class="status" id="chartStatus" role="status">
        Loading history...
      </div>

      <div class="status" id="resetStatus" role="status"></div>
    </section>

    <footer>
      Powered by ESP32-C3, Vilho Kemppainen and ThingSpeak
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
